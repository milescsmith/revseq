[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "revseq"
version = "2.0.0"
description = "reverse and/or complement dna sequence"
authors = [
    { name = "Miles Smith", email = "mileschristiansmith@gmail.com" }
]
license = { text = "GPL-3.0" }
readme = "README.rst"
requires-python = ">= 3.10"
dependencies = [
    "typer>=0.12.3",
    "icontract>=2.6.6",
    "rich>=13.7.1",
    "typeguard>=4.2.1",
]
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.urls]
homepage = "https://github.com/milescsmith/revseq"
repository = "https://github.com/milescsmith/revseq"
changelog = "https://github.com/milescsmith/revseq/releases"

[project.scripts]
revseq = "revseq.__main__:app"

[project.optional-dependencies]
vectorized = [
    "numba>=0.60.0",
    "numpy>=2.0.0",
]
[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["revseq"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "codecov>=2.1.13",
    "hypothesis>=6.104.1",
    "nox>=2024.4.15",
    "pytest>=8.2.2",
    "mypy>=1.10.1",
    "coverage>=7.5.4",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.10",
]
