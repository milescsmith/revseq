[build-system]
requires = ["uv_build>=0.7.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "revseq"
version = "1.3.0"
description = "reverse and/or complement dna sequence"
authors = [
    { name = "Miles Smith", email = "mileschristiansmith@gmail.com" }
]
readme = "README.rst"
requires-python = ">= 3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "typer>=0.29.0",
    "icontract>=2.7.3",
    "rich>=15.0.0",
    "typeguard>=4.6.0",
]
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.urls]
homepage = "https://github.com/milescsmith/revseq"
repository = "https://github.com/milescsmith/revseq"
changelog = "https://github.com/milescsmith/revseq/releases"

[project.scripts]
revseq = "revseq.__main__:app"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["revseq"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "coverage>=7.16.2",
    "hypothesis>=6.168.5",
    "nox>=2026.10.20",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

